version: 2

project_name: ajaxbridge

before:
  hooks:
    - go test ./bridge/...
    - npm --prefix ./ha-cards run verify
    - python3 scripts/package-jeedom.py --version {{ .Version }} --timestamp {{ .CommitTimestamp }}
    - >-
      tar --sort=name --mtime=@{{ .CommitTimestamp }} --owner=0 --group=0
      --numeric-owner --format=gnu -czf ha-cards-dist.tar.gz -C ha-cards/dist .

builds:
  - id: ajaxbridge
    main: ./bridge/cmd/ajaxbridge
    binary: ajaxbridge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -buildvcs=false
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }}

archives:
  - formats:
      - tar.gz

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./ha-cards-dist.tar.gz
    - glob: ./AjaxBridge_{{ .Version }}_jeedom_patch.zip

sboms:
  - id: archives
    artifacts: archive
  - id: source
    artifacts: source

docker_digest:
  name_template: digests.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz

changelog:
  use: git
  sort: asc

dockers_v2:
  - id: ajaxbridge
    ids:
      - ajaxbridge
    dockerfile: bridge/Dockerfile.goreleaser
    extra_files:
      - bridge/logo.png
    images:
      - rcooler/ajax2prometheus
      - rcooler/ajax-bridge
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Ajax security hub SIA DC-09 to Prometheus exporter"
      org.opencontainers.image.url: "{{ .GitURL }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    annotations:
      "index,manifest:org.opencontainers.image.title": "{{ .ProjectName }}"
      "index,manifest:org.opencontainers.image.description": "Ajax security hub SIA DC-09 to Prometheus exporter"
      "index,manifest:org.opencontainers.image.source": "{{ .GitURL }}"
      "index,manifest:org.opencontainers.image.licenses": MIT
      "index,manifest:org.opencontainers.image.version": "{{ .Version }}"
      "index,manifest:org.opencontainers.image.revision": "{{ .FullCommit }}"
      "index,manifest:org.opencontainers.image.created": "{{ .Date }}"
    flags:
      - --provenance=mode=max
      - --pull
    sbom: true
    platforms:
      - linux/amd64
      - linux/arm64

docker_signs:
  - id: keyless
    artifacts: all
    args:
      - sign
      - "${artifact}@${digest}"
      - --yes
    output: true

release:
  replace_existing_artifacts: true
  include_meta: true
  preflight:
    fail_on_error: true
  extra_files:
    - glob: ./ha-cards-dist.tar.gz
    - glob: ./AjaxBridge_{{ .Version }}_jeedom_patch.zip
