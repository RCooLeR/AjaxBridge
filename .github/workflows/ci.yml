name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check generated and runtime files stay untracked
        run: |
          tracked="$(git ls-files 'bridge/data/*' 'ha-cards/dist/*' '.idea/*')"
          if [ -n "$tracked" ]; then
            printf 'Generated/runtime files must not be tracked:\n%s\n' "$tracked"
            exit 1
          fi

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check

  jeedom:
    name: Jeedom bundle
    # The official Ubuntu 24.04 runner includes PHP CLI and Python 3.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify validation runtimes
        run: |
          php -n -r 'if (PHP_VERSION_ID < 70400) { exit(1); } echo "PHP " . PHP_VERSION . PHP_EOL;'
          python3 -c 'import sys; assert sys.version_info >= (3, 10); print(sys.version)'

      - name: Verify bundle checksums
        run: php -n Jeedom/verify.php

      - name: Lint all bundled PHP files
        shell: bash
        run: |
          set -euo pipefail
          find Jeedom -type f -name '*.php' -print0 | sort -z | xargs -0 -r -n 1 php -n -l

      - name: Validate electrical audit with offline stubs
        run: php -n Jeedom/validation/electrical-contract-audit.php

      - name: Test standalone archive packaging
        run: python3 -m unittest discover -s scripts -p 'test_package_jeedom.py' -v

  bridge:
    name: bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bridge
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bridge/go.mod
          cache: true
          cache-dependency-path: bridge/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Scan Go dependencies
        run: go tool govulncheck ./...

  ha-cards:
    name: ha-cards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ha-cards/.node-version
          cache: npm
          cache-dependency-path: ha-cards/package-lock.json

      - name: Use pinned npm
        run: |
          npm install --global npm@12.1.0
          test "$(npm --version)" = 12.1.0

      - name: Install dependencies
        run: npm --prefix ./ha-cards ci

      - name: Verify
        run: npm --prefix ./ha-cards run verify

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Collect image metadata
        id: image-metadata
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          {
            echo "version=ci-${short_sha}"
            echo "created=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Compose configuration
        run: docker compose --file bridge/docker-compose.yml config --quiet

      - name: Lint Dockerfile
        run: docker buildx build --check --file bridge/Dockerfile bridge

      - name: Validate multi-platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./bridge
          file: ./bridge/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          pull: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.image-metadata.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.image-metadata.outputs.created }}
          cache-from: type=gha,scope=ajaxbridge-ci
          cache-to: type=gha,mode=max,scope=ajaxbridge-ci

      - name: Build smoke-test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./bridge
          file: ./bridge/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ajaxbridge:ci
          pull: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.image-metadata.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.image-metadata.outputs.created }}
          cache-from: type=gha,scope=ajaxbridge-ci

      - name: Smoke-test hardened image
        shell: bash
        run: |
          set -euo pipefail
          data_dir="${RUNNER_TEMP}/ajaxbridge-data"
          mkdir -p "$data_dir"
          chmod 0777 "$data_dir"

          docker run --detach --name ajaxbridge-ci \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --pids-limit=256 \
            --mount "type=bind,src=${data_dir},dst=/data" \
            ajaxbridge:ci
          trap 'docker rm --force ajaxbridge-ci >/dev/null 2>&1 || true' EXIT

          for _ in {1..45}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' ajaxbridge-ci)"
            if [ "$status" = healthy ]; then
              break
            fi
            if [ "$status" = unhealthy ]; then
              docker logs ajaxbridge-ci
              exit 1
            fi
            sleep 1
          done

          test "$(docker inspect --format '{{.State.Health.Status}}' ajaxbridge-ci)" = healthy
          docker exec ajaxbridge-ci /app/ajaxbridge healthcheck
          docker exec ajaxbridge-ci sh -c 'touch /data/.writable && rm /data/.writable'

          container_user="$(docker inspect --format '{{.Config.User}}' ajaxbridge-ci)"
          if [ -z "$container_user" ] || [ "$container_user" = 0 ] || [ "$container_user" = root ]; then
            echo "Container must run as a non-root user"
            exit 1
          fi

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ajaxbridge:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln,secret
          pkg-types: os,library
          version: v0.74.0
