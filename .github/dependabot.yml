version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /bridge
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /ha-cards
    schedule:
      interval: weekly
    # Keep Node declarations aligned with the supported runtime in .node-version.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-packages:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /bridge
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns:
          - "*"
