services:
  ajaxbridge:
    image: ${AJAXBRIDGE_IMAGE:-rcooler/ajax-bridge:latest}
    container_name: ajaxbridge
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 15s
    ports:
      - "8080:8080"
      - "8099:8099"
    environment:
      # Leave empty for an existing installation to preserve its MQTT/HA identities.
      # New installations can use apartment; see docs/multiple-installations.md.
      AJAXBRIDGE_SOURCE_ID: "${AJAXBRIDGE_SOURCE_ID:-}"
      AJAXBRIDGE_HTTP_ADDR: ":8080"
      AJAXBRIDGE_SIA_ADDR: ":8099"
      AJAXBRIDGE_ACCOUNT: "0001"
      AJAXBRIDGE_LOG_LEVEL: "info"
      AJAXBRIDGE_LOG_PRETTY: "false"
      AJAXBRIDGE_STRICT_CRC: "true"
      AJAXBRIDGE_PING_INTERVAL: "60s"
      AJAXBRIDGE_OFFLINE_GRACE: "180s"
      AJAXBRIDGE_READ_TIMEOUT: "120s"
      AJAXBRIDGE_FORWARD_TIMEOUT: "5s"
      AJAXBRIDGE_FORWARD_REQUIRE_ACK: "false"
      # File bases receive a source directory, e.g. /data/apartment/devices.json.
      AJAXBRIDGE_DEVICES_PATH: "/data/devices.json"
      AJAXBRIDGE_NOTIFICATIONS_PATH: "/data/notifications.json"
      AJAXBRIDGE_JEEDOM_STORE_PATH: "/data/jeedom.json"

      # Optional: AES key configured in Ajax SIA monitoring settings.
      # AJAXBRIDGE_ENCRYPTION_KEY: "REPLACE_WITH_32_HEX_AES_KEY"

      # Optional: publish Home Assistant MQTT discovery and retained state.
      # With SOURCE_ID=apartment, topic/client bases become
      # ajaxbridge/apartment and ajaxbridge-apartment, including explicit bases.
      # AJAXBRIDGE_MQTT_BROKER: "tcp://homeassistant.local:1883"
      # AJAXBRIDGE_MQTT_USERNAME: "mqtt-user"
      # AJAXBRIDGE_MQTT_PASSWORD: "mqtt-password"
      # AJAXBRIDGE_MQTT_TOPIC_PREFIX: "ajaxbridge"
      # AJAXBRIDGE_MQTT_DISCOVERY: "true"

      # Optional: consume Jeedom Ajax plugin values from MQTT Manager.
      # With SOURCE_ID=apartment, configure MQTT Manager root_topic=jeedom_apartment.
      # Unset input/control topic settings then use that root automatically.
      # AJAXBRIDGE_JEEDOM_ENABLED: "true"
      # AJAXBRIDGE_JEEDOM_EVENT_TOPIC: "jeedom/cmd/event/#"
      # AJAXBRIDGE_JEEDOM_DISCOVERY_TOPIC: "jeedom/discovery/eqLogic/#"
      # AJAXBRIDGE_JEEDOM_STATE_TOPIC_PREFIX: "ajaxbridge/jeedom"
      # AJAXBRIDGE_JEEDOM_DISCOVERY: "true"
      # AJAXBRIDGE_JEEDOM_EMPTY_VALUE_POLICY: "keep_last"
      # AJAXBRIDGE_JEEDOM_SAMPLE_DIR: "/data/tmp-jeedom"
      # AJAXBRIDGE_JEEDOM_DISCOVER_UNLINKED: "false"
      # AJAXBRIDGE_JEEDOM_ACCOUNT_NAMES: "Будинок"
      # AJAXBRIDGE_JEEDOM_CONTROLS_ENABLED: "false"
      # AJAXBRIDGE_JEEDOM_SET_TOPIC_PREFIX: "jeedom/cmd/set"
      # AJAXBRIDGE_JEEDOM_CONTROL_PAYLOAD: "1"

      # Optional: forward raw SIA frames to Home Assistant's SIA integration.
      # Use an IP/hostname reachable from inside this container.
      # AJAXBRIDGE_FORWARD_ADDR: "home-assistant.example:12345,cms.example:7700"
    volumes:
      # Empty source uses /data/devices.json; apartment uses /data/apartment/devices.json.
      # Use a separate host data directory per bridge in production.
      - ./data:/data
    healthcheck:
      test: ["CMD", "/app/ajaxbridge", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      start_interval: 2s
      retries: 3
